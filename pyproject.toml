[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "logisim-live-mcp"
version = "2.2.0"
description = "Live MCP server for Logisim Evolution: AI agents draw, wire, inspect and simulate digital circuits directly in the running Logisim window."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT AND GPL-3.0-or-later"
license-files = ["LICENSE", "java-plugin/LICENSE"]
authors = [{ name = "Logisim Live MCP contributors" }]
keywords = [
    "mcp",
    "model-context-protocol",
    "logisim",
    "logisim-evolution",
    "digital-logic",
    "circuit",
    "claude",
    "codex",
    "ai-agent",
    "education",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Education",
    "Intended Audience :: Developers",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Java",
    "Topic :: Education",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]
dependencies = [
    "lxml>=5.2,<7",
    "mcp>=1.22,<2",
]

[project.optional-dependencies]
png = [
    "cairosvg>=2.7,<3",
]
dev = [
    "pytest>=7.4,<9",
    "pytest-cov>=5,<7",
    "python-xlib>=0.33; sys_platform == 'linux'",
    "build>=1.2",
]

[project.scripts]
logisim-mcp = "logisim_mcp.cli:main"

[project.urls]
Homepage = "https://github.com/anhduckkzz/logisim-live-mcp"
Documentation = "https://github.com/anhduckkzz/logisim-live-mcp#readme"
Issues = "https://github.com/anhduckkzz/logisim-live-mcp/issues"
Changelog = "https://github.com/anhduckkzz/logisim-live-mcp/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
logisim_mcp = ["plugin/*.jar"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
